# Emilia Studio Portable Configuration Template
# Use `emilia config init --root-dir <workspace> --python <inference-python>`.
# Priority: environment fields > explicit/EMILIA_CONFIG_TOML file > user file > source checkout file.
# Relative TOML paths resolve beside the TOML file, never against the working directory.

[paths]
# Installed defaults use a writable user workspace; source checkouts retain their root.
# root_dir = "."
# app_dir = "./app"
# output_dir = "./app/output"
# temp_dir = "./temp"
# workflows_dir = "./workflows/api"
# visual_workflows_dir = "./workflows/visual"
# conda_python = "C:/Miniconda/envs/comfyui/python.exe"
# ollama_exe = "C:/Users/you/AppData/Local/Programs/Ollama/ollama.exe"
# resources_dir = "./resources"  # optional immutable resource override; normally bundled

[services]
comfy_host = "127.0.0.1"
comfy_port = 8188
quality_port = 8199
ollama_base = "http://127.0.0.1:11434"
ollama_model = "qwen3.5:9b"
# Per-graph execution deadline and WebSocket silence watchdog (seconds; <=0 disables).
stage_timeout_s = 900
stall_timeout_s = 300

[models]
# The ultra profile's LoRA. Graphs never fall back to another file: a missing LoRA fails loudly.
# ultra_lora_name = "Emilia_Rezero_Q-000005.safetensors"
