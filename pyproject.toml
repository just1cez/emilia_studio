[build-system]
requires = ["setuptools>=75", "wheel>=0.44"]
build-backend = "setuptools.build_meta"

[project]
name = "emilia-studio"
dynamic = ["version"]
description = "High-Res SDXL + IPAdapter + Detailer + Upscale Pipeline, Quality Inspector, Ollama Compiler, Interactive TUI, and SQLite Ledger for Emilia (Re:Zero)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp",
    "numpy",
    "Pillow",
]

[project.optional-dependencies]
build = ["build==1.3.0", "pyinstaller==6.16.0"]
inspection = ["ultralytics>=8.3,<9"]

[project.scripts]
emilia-studio = "emilia_studio.cli:main"
emilia = "emilia_studio.cli:main"

[tool.setuptools.packages.find]
include = ["emilia_studio*"]

[tool.setuptools.dynamic]
version = {attr = "emilia_studio._version.__version__"}

# build_support copies the canonical top-level resources only into build/lib.
# No generated resource duplicates are maintained in the source package.
[tool.setuptools.cmdclass]
build_py = "build_support.ResourceBuildPy"
