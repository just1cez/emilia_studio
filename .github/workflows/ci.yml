name: Emilia Studio CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  unit-tests:
    # The project runs on Windows; Linux stays in the matrix to keep the controller portable.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install CPU test dependencies
        # CPU torch and OpenCV enable the runtime-plugin and garment-geometry tests,
        # which skip themselves without them.
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install opencv-python-headless
          pip install -e .

      - name: Verify Emilia Studio package imports, workflow audit, and CLI
        run: |
          python -m emilia_studio.cli --help
          python -m emilia_studio.cli workflows

      - name: Run Emilia Studio standalone unit tests
        run: |
          python -m pytest tests/
