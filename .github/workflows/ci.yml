name: Emilia Studio CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy Pillow aiohttp pytest
          pip install -e .

      - name: Verify Emilia Studio package imports, workflow audit, and CLI
        run: |
          python -m emilia_studio.cli --help
          python -m emilia_studio.cli workflows

      - name: Run Emilia Studio standalone unit tests
        run: |
          python -m pytest tests/
